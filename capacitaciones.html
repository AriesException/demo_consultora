<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Capacitaciones | Tu Consultora</title>
    <link rel="stylesheet" href="assets/style.css">
    <script src="assets/app.js"></script>
</head>

<body data-p="capacitaciones">
    <main>
        <section class="hero">
            <div class="w">
                <h1>Capacitaciones</h1>
                <p>Elige un curso, agrégalo al carrito y paga en línea. Modalidad virtual o presencial.</p>
            </div>
        </section>
        <section class="sec">
            <div class="w">
                <div class="filters"><input id="q" type="search" placeholder="Buscar capacitación"
                        aria-label="Buscar"><select id="t" aria-label="Tema">
                        <option value="">Todos los temas</option>
                        <option>Planificación</option>
                        <option>Inventarios</option>
                        <option>Logística</option>
                        <option>Abastecimiento</option>
                    </select><select id="m" aria-label="Modalidad">
                        <option value="">Toda modalidad</option>
                        <option>Virtual</option>
                        <option>Presencial</option>
                    </select></div>
                <div class="grid" id="lista"></div>
            </div>
        </section>
    </main>
</body>

</html>
